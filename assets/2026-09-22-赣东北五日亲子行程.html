","tag":"自驾","sources":[51]},{"time":"17:00左右","title":"办理入住、吃晚饭","text":"在金沙连锁酒店安顿，确认次日索道、接驳与退房后停车；不去篁岭或婺女洲。","tag":"休整","sources":[]},{"time":"20:30前后","title":"早点休息","text":"准备轻背包、雨衣、防滑鞋、水与孩子熟悉的零食。这个时间是作息建议，不是酒店服务承诺。","tag":"","sources":[]}],"legs":[{"name":"上饶站 → 三清山东部金沙","time":"预留90—120分钟","note":"OSRM静态路网约78.7km；不是实时路况，导航到酒店或正规停车场。","sources":[51]}],"rainSummary":"晚到或道路天气不安全时，改在玉山县城连锁安顿；天气仍恶劣则不继续赶山路。原计划酒店取消条款先核。","rainDrive":"上饶站→玉山县城45—65分钟","rainStops":["shangrao_station","yushan"],"rainTimeline":[{"time":"抵达后","title":"先评估天色、天气与疲劳","text":"不为赶行程而加速或夜间疲劳驾驶。","tag":"","sources":[]},{"time":"晚间","title":"玉山县城全季候选","text":"若确有房且道路安全，可在玉山县城落脚；次晨去金沙再预留60—90分钟。若更晚则就近在上饶选择可核的连锁。","tag":"替代","sources":[40,41,50]},{"time":"睡前","title":"决定次日是否上山","text":"雷暴、大风、暴雨预警或索道停运就取消登山，不用卧龙谷替代。","tag":"","sources":[]}],"rainLegs":[{"name":"上饶站 → 玉山县城","time":"预留45—65分钟","note":"此点为县城，不是玉山南站。酒店实际入口另导航。","sources":[49]}],"ticketNote":"出发前先核往返铁路、座椅和跨城还车，再订不可取消的景区票；本文件没有任何预订。","ticketSources":[12,14,15],"tips":["住金沙不是住玉山县城。君澜现名已核；旧“开元名都”是同一家，不重复选。","君澜为度假连锁，未设实时价格；预算不合适才考虑县城连锁替代，接受次日额外车程。","不要在高铁抵达日再塞篁岭和夜游。"],"index":0,"date":"2026-09-22","weekday":"周二","holiday":false},{"card":"三清山 · 轻徒步","short":"金沙往返 → 婺源","title":"三清山，只走适合孩子的小段","mapTitle":"金沙索道 → 婺源县城","summary":"全程唯一登山日，金沙上、金沙下。只看女神栈道近景，状态好才延伸巨蟒区域；下午转婺源。","drive":"下山后90—120分钟","effort":"中等偏高 · 有台阶，随时减量","sleepLabel":"住婺源县城 · 连住第1晚","stops":["jinsha","wuyuan_city"],"hotelIds":["wuyuan-ji-government","wuyuan-hanting-xiangao"],"timeline":[{"time":"07:00—08:00","title":"早餐、寄存行李","text":"不空腹登山。先确认当日索道时间、分流线路与停车；本方案不把往年节假日班次当9/23时刻。","tag":"准备","sources":[1,78]},{"time":"上午","title":"金沙索道上山","text":"目标按当日开放时段尽早进。上站先问最近安全观景路线，走30—45分钟后看孩子状态。","tag":"主项目","sources":[2,76]},{"time":"约3—4小时","title":"女神栈道近景为主","text":"参考：金沙上站→女神栈道→东方女神观景区域；体力好且开放才加巨蟒出山。不是无台阶线路，按现场最短合法路线返回。","tag":"可缩短","sources":[73,76]},{"time":"12:30—14:30","title":"索道下山、午饭和休息","text":"连同索道及排队为活动预留4—6小时；孩子累就只做1—2小时近景后下山，不凑满路线。","tag":"退出分支","sources":[]},{"time":"下午","title":"转场婺源县城","text":"取行李后再出发，规划90—120分钟；驾驶员疲劳就停止赶路，先联系原酒店是否可续住并减量次日行程。","tag":"自驾","sources":[52]},{"time":"入住后","title":"洗澡、补休与清淡晚餐","text":"不再安排婺女洲夜游，把恢复体力放在前面。","tag":"休息","sources":[]}],"legs":[{"name":"三清山金沙下站 → 婺源县城","time":"预留90—120分钟","note":"静态路网约69.9km；不回玉山拿行李。","sources":[52]}],"rainSummary":"雷暴、大风、暴雨或索道停运就取消登山。道路安全且预约成功才提前赴婺源博物馆；否则留酒店休息，稳定后再转场。","rainDrive":"安全可走时90—120分钟","rainStops":["jinsha","wuyuan_city"],"rainTimeline":[{"time":"早餐前","title":"取消登山，不赌云海","text":"不把山谷、瀑布、玻璃项目当雨天备选。","tag":"","sources":[]},{"time":"道路安全时","title":"提前转婺源县城","text":"仍按90—120分钟预留，若天气不允许就联系金沙酒店续住；不能保证临时房态。","tag":"交通","sources":[52]},{"time":"10点后／下午","title":"婺源博物馆或酒店亲子活动","text":"博物馆先按官方渠道预约，门票免费；官网开门时间有8:30/9:00差异，排10点后并临行复核。未约到就休息，不临时赌票。","tag":"室内","sources":[44,79]},{"time":"下午","title":"午休和县城吃饭","text":"不把取消的三清山挪到9/25中秋再折返。","tag":"","sources":[]}],"rainLegs":[{"name":"金沙服务区 → 婺源县城","time":"预留90—120分钟","note":"仅在道路安全且驾驶员有精力时转场。","sources":[52]}],"ticketNote":"按三清山2026政策：6岁或身高≤1.2m免景区门票；索道另按身高，≤1.2m免。恰好120cm以现场测量及证件为准，若超过120cm索道可能需儿童票，门票年龄规则仍单独判断。","ticketSources":[1],"tips":["不走玉京峰、三清宫、西海岸＋阳光海岸大环线，不串玉台/杜鹃谷/一线天。","不用推车上山；路段可能有密集台阶和临崖栈道，不保证六岁孩子全程能走完。","下山越晚，婺源转场越应减量；提前核两地酒店取消条款。"],"index":1,"date":"2026-09-23","weekday":"周三","holiday":false},{"card":"篁岭 · 晒秋古村","short":"婺源连住 · 不赶夜游","title":"篁岭早进早出，下午回去休息","mapTitle":"婺源县城 ↔ 篁岭","summary":"中秋前一天看晒秋，只保留古村和天街短线。回县城午休，不硬拼婺女洲夜场。","drive":"往返约120—180分钟","effort":"中等 · 石阶与村落步行","sleepLabel":"同住婺源县城 · 第2晚","stops":["wuyuan_city","huangling","wuyuan_city"],"hotelIds":["wuyuan-ji-government","wuyuan-hanting-xiangao"],"timeline":[{"time":"07:00","title":"酒店早餐后出发","text":"县城至篁岭预留60—90分钟，停车与索道另留余量。导航到景区指定停车场，不直接跟地图上的山上村落点开车。","tag":"自驾","sources":[55]},{"time":"08:30前后","title":"按预约进入篁岭","text":"以实际开放、预约为准。当前官网商品A索道可用、B暂未开放，不依赖双索道穿越。","tag":"主项目","sources":[46,68,69]},{"time":"上午约3—4小时","title":"晒秋古村＋天街短线","text":"选少量晒秋点，避开玻璃项目、长吊桥、高岭梯田和石门峡；孩子累则缩短，不追全景机位。","tag":"","sources":[]},{"time":"12:00左右","title":"就近吃一餐再下山","text":"点 rg/route/v1/driving/117.6449342,29.4659735;117.2307756,29.2977885?overview=simplified&geometries=geojson&steps=false"},{"title":"taoyangli2 → jingdezhen_north 道路模型","url":"https://router.project-osrm.org/route/v1/driving/117.2007716,29.298766;117.2376217,29.3416354?overview=simplified&geometries=geojson&steps=false"},{"title":"wuyuan_city → taoxichuan 道路模型","url":"https://router.project-osrm.org/route/v1/driving/117.8558318,29.2506588;117.2307756,29.2977885?overview=simplified&geometries=geojson&steps=false"},{"title":"huangling → wuyuan_city 道路模型","url":"https://router.project-osrm.org/route/v1/driving/118.1132609,29.3235898;117.8558318,29.2506588?overview=simplified&geometries=geojson&steps=false"},{"title":"taoxichuan → taoyangli2 道路模型","url":"https://router.project-osrm.org/route/v1/driving/117.2307756,29.2977885;117.2007716,29.298766?overview=simplified&geometries=geojson&steps=false"},{"title":"wuyuan_city → jujing 道路模型","url":"https://router.project-osrm.org/route/v1/driving/117.8558318,29.2506588;117.6449342,29.4659735?overview=simplified&geometries=geojson&steps=false"}],"airDay":{"card":"飞机抵达 · 金沙安顿","short":"三清山机场 → 金沙山脚","title":"落地后直达金沙，不必进市区","mapTitle":"三清山机场 → 金沙山脚","summary":"可选北京首都直飞上饶三清山机场，再预约合规车辆或已确认可机场取车的租车去金沙酒店。机场不在景区；这只是交通备选，不代表已出票。","drive":"机场→金沙120—150分钟，另留到达/取车60—90分钟","effort":"低 · 抵达日","sleepLabel":"住金沙服务区 · 1晚","stops":["sqd_terminal","jinsha"],"hotelIds":["sanqingshan-narada","yushan-ji-jiangjunmiao"],"timeline":[{"time":"订票前","title":"优先查PEK → SQD","text":"国航CA1895航季计划覆盖9/22周二，计划08:00—10:15；仅作查询线索，具体当天执行、票价与余票待国航确认。首都是PEK，不要误选大兴。","tag":"未出票","sources":[]},{"time":"落地后","title":"取行李、接车或取车","text":"为出航站楼、行李、交接车辆与安装儿童座椅预留60—90分钟。机场取车、跨城还车和座椅都需事前落实，不能默认现场有车。","tag":"接驳","sources":[]},{"time":"转场","title":"机场直接去金沙山脚","text":"路网模型约94.8km、76.2分钟，家庭行程按120—150分钟留量；不必先进上饶市区或高铁站。不把模型时长当山路保证。","tag":"自驾/接送","sources":[]},{"time":"午后","title":"办理入住，先吃饭和休息","text":"若按10:15落地且采用以上余量，约13:15—14:15到金沙是规划估计；航班延误、长等车或中途用餐另计。没有提前入住保证。","tag":"休整","sources":[]},{"time":"晚间","title":"只做轻准备，不加景点","text":"补水、清淡晚餐，备好雨衣和防滑鞋。照顾孩子早班机后的疲劳，第二天再决定上山长度。","tag":"","sources":[]}],"legs":[{"name":"上饶三清山机场 → 金沙索道服务区","time":"预留120—150分钟","note":"静态道路94.8km，模型76.2分钟；不是实时导航。","sources":[]}],"rainSummary":"航班晚点、强降雨或驾驶员疲劳时，不硬赶金沙。地图仅表示道路安全时可走的转场线；需要滞留就联系机场服务或就近连锁另核住宿。","rainDrive":"仅道路安全才继续，行车预留120—150分钟","rainStops":["sqd_terminal","jinsha"],"rainTimeline":[{"time":"出发前","title":"先核航班与道路天气","text":"远期天气不是登山依据；如航班或接机有变化，先联系承运方和酒店。","tag":"","sources":[]},{"time":"落地后","title":"不硬开陌生山路","text":"道路安全、司机有精力才继续去金沙；否则询机场服务或就近连锁房态，不承诺临时有房。","tag":"","sources":[]},{"time":"晚间","title":"在安全落脚处休息","text":"雨大、晚到就取消当天额外活动；不再加观景点，也不把酒店雨备当免费设施。","tag":"","sources":[]}],"rainLegs":[{"name":"上饶三清山机场 → 金沙索道服务区","time":"预留120—150分钟","note":"静态道路94.8km，模型76.2分钟；不是实时导航。","sources":[]}],"ticketNote":"飞机票儿童适用票价、托运行李与退改条件以航司订单为准，不套用铁路儿童票规则；接送车或租车须落实适配座椅。","ticketSources":[],"tips":["机场名带“三清山”，不代表落在景区；不必进上饶市区换乘，但未核机场直达金沙巴士。","北京首都PEK与北京大兴PKX分别查；目前优先线索为PEK→SQD国航CA1895航季计划。","早班机需评估出门时间与孩子睡眠；若票价/接车不合适，保留高铁到上饶站方案。"],"index":0,"date":"2026-09-22","weekday":"周二","holiday":false},"guides":{"2026-09-22":{"date":"2026-09-22","theme":"抵达休整","highlights":[{"name":"照片里的花岗岩：先猜石头像什么","why":"三清山的特色是花岗岩峰林。入住后看官方女神峰、巨蟒峰照片，先让孩子猜人物或动物，再揭晓名字；这是家庭预习，不要求今晚从山脚看见它们。","childLine":"明天的大山像一本石头图画书，你觉得这一页画的是谁？","priority":"可选预习"},{"name":"画一张金沙往返小地图","why":"在纸上画索道、山路、返回箭头，再给水和雨衣画小图标。把“上山后还要走路、看够就回”变成孩子能理解的路线；家庭规划建议，不是官方活动。","childLine":"索道送我们上山，我们只看有精神看的那一段，再坐金沙索道回来。","priority":"可选准备"}],"order":"家庭规划建议：先入住、吃饭；有精神才看山石照片。 画返回箭头、一起收轻背包，然后休息；晚到两项都不做。","rest":"家庭规划建议：就在已入住酒店客房休息；不预设酒店有儿童活动室，也不为预习出门找观景点。","skip":"照片预习和画地图都可删，睡好优先。 不加山脚支线、夜游或提前登山。","links":[{"title":"景区/场馆介绍","url":"http://www.sqsfjq.com/index.php?s=/Home/News/detail/id/2159.html"}]},"2026-09-23":{"date":"2026-09-23","theme":"花岗岩峰林","highlights":[{"name":"女神栈道近景：一座峰和一片峰林","why":"官方将南清园列为花岗岩峰林的代表。在获准停留的观景处，先看眼前一座石峰的轮廓，再看后面层层山峰；孩子可用一根手指在空中描出尖、圆、弯。","childLine":"一座像石头小塔，许多座站在一起，就像石头森林。","priority":"优先看"},{"name":"东方女神：从轮廓里找人物","why":"官方用“长发飘逸、端坐”描写这座造型石。让孩子先说哪里像头发、哪里像坐姿，再解释“女神”是人们看着自然山石起的名字，不是人工雕像。","childLine":"石头不会真的坐下来，是我们的眼睛把它看成了一位长头发的人。","priority":"顺路优先"},{"name":"巨蟒出山：只在有余力时加看","why":"这座独立石峰头部较大、腰身细长，因形似巨蟒得名。和女神峰比较“同是石头，为什么名字不同”；只在开放路线顺接、孩子状态好时看，不为凑齐两峰绕行。","childLine":"你能找出它的大脑袋和细身子吗？它只是像蛇的石峰，不是真蛇。","priority":"可删延伸"}],"order":"家庭规划建议：金沙索道上站先请工作人员确认近景、开放方向和最短合法返回线。 允许时走女神栈道近景，再看东方女神；这是观察优先级，不是已核定的小环线导航。 巨蟒出山可加可不加；按现场指示回金沙索道，下山后转婺源，不跨口穿越。","rest":"家庭规划建议：请工作人员指认开放的安全休息区域，或在允许停留且不挡通行的宽处补水；未核到具体座椅点，不在窄栈道、台阶或崖边坐。下山、转场后回住处休息。","skip":"先删巨蟒延伸；累或怕高时只留工作人员确认的上站近景。 不加玉京峰、玉台/一线天、西海岸与阳光海岸大圈，不为云海久等。","links":[{"title":"景区/场馆介绍","url":"http://www.sqsfjq.com/index.php?s=/Home/News/detail/id/2159.html"}]},"2026-09-24":{"date":"2026-09-24","theme":"晒秋与徽派老屋","highlights":[{"name":"晒秋古村：为什么把农作物晒到屋顶？","why":"篁岭依山而建、平地少，官网介绍村民用竹簟在屋顶木架上晾晒农作物。先找现场的颜色和圆形晒具，再讲它不只是好看的布景，也是人们顺应地形的生活办法；摆晒随天气变化。","childLine":"村里没有大平地，大家就请屋顶帮忙晒粮食，你觉得这个办法聪明吗？","priority":"优先看"},{"name":"五桂堂木雕：给老房子读一幅图","why":"官网介绍五桂堂是当地祖宅，屋内有精致木雕，堂名寄托对子孙的期望。若开放且顺路，选一块看得清的木雕，让孩子找线条、猜图案；含义不明就看说明，不编吉祥故事。","childLine":"木头上也能刻出图画，你先发现的是花纹，还是一个小故事？","priority":"顺路可选"}],"order":"家庭规划建议：按当日运行安排乘A索道，先在晒秋古村允许参观处看晒具与村屋。 沿天街小段找五桂堂；仅在开放且顺路时短看，不把点名顺序当必须折返的路线。 午饭小休后回A索道；晒工坊位于高处，只有顺路且有余力才去，不为最佳机位另登高。","rest":"家庭规划建议：在天街沿线现场确认可坐的餐饮店或景区指定休息区休息，消费另计；未核到免费座椅位置，不坐晒台、居民门槛或台阶挡路。返住处再午休。","skip":"五桂堂未开放或孩子不感兴趣就删，只看晒秋古村一小段也足够。 晒工坊高处机位可删；不加梯田长线、玻璃项目、长吊桥、石门峡或婺女洲夜游。","links":[{"title":"景区/场馆介绍 1","url":"http://www.wyhl.cc/wzhl/jxjd/hljd/detail2023-08-02-8.html"},{"title":"景区/场馆介绍 2","url":"http://www.wyhl.cc/wzhl/jxjd/hljd/detail2023-08-01-25.html"}]},"2026-09-25":{"date":"2026-09-25","theme":"老瓷厂的新生活","highlights":[{"name":"锯齿厂房与烟囱：找老工厂留下的线索","why":"陶溪川以原宇宙瓷厂为核心，保留锯齿状厂房、烟囱、水塔等工业遗存。在开放步行区从外面认轮廓，聊“以前生产瓷器的地方，如今可以看艺术、逛文创”，不必进馆或爬遗存。","childLine":"屋顶像锯齿、烟囱像高塔，这些是老瓷厂留下来的线索。","priority":"轻松优先"},{"name":"一只杯子的设计：好看之外还要好用","why":"这里有陶瓷创意与青年创作业态。若遇开放店铺或展示，选一只杯或碗，比较口沿、把手、花纹，问孩子想用它喝什么；这是家庭观察建议，不指定必有某件商品，也不依赖市集。","childLine":"如果给你设计一只杯子，你会先改把手，还是先画上喜欢的花纹？","priority":"可选观察"}],"order":"家庭规划建议：菊径只保留可撤销短停；绕路或疲劳就直接转景德镇，落脚后先午休。 休息后愿意出门才去陶溪川：开放步行区看厂房外形，再顺路看一处陶瓷展示。 看够便就餐或回酒店；不为找某栋建筑、某家店或未确认的集市走遍园区。","rest":"家庭规划建议：主要休息放在景德镇住处；街区内只选现场确认可使用的座位、指定休息区或愿意接待的餐饮店，不预设免费休息室。","skip":"菊径优先删，不为圆村全景登坡；陶溪川整段也可因疲劳取消。 不追市集、不补多个馆展；若已确认并选择一项陶艺课，就用它替代散步，不叠加。","links":[{"title":"景区/场馆介绍","url":"https://www.jdz.gov.cn/zjcd/mljdz/sj/t932854.shtml"}]},"2026-09-26":{"date":"2026-09-26","theme":"制瓷与器物","highlights":[{"name":"看器形：古窑看拉坯；御窑替代看器物轮廓","why":"古窑：官方介绍有传统制瓷作坊和拉坯展示，挑一个正在进行的步骤看手怎样改变泥坯，无作业就看展板。御窑替代：在已约成功的开放展厅选一件器物，找口、腹、底并猜用途，再读展签核对；具体展品不预设。","childLine":"古窑：师傅的手一动，泥巴的形状哪里变了？御窑替代：它的口这么大，你猜以前是装什么的？","priority":"二选一主项目"},{"name":"看形状与纹样：古窑认窑型；御窑替代读装饰","why":"古窑：有清代蛋形镇窑及复建的葫芦窑、馒头窑、龙窑等，选就近开放的一两种，按说明比较名称与外形，不需看全或等烧窑。御窑替代：选一件当日可见的器物找重复线条或图案，再按展签核对；只观察完整展品，不捡碎瓷、不猜定纹样寓意。","childLine":"古窑：这座窑的名字像一种食物或动物，你能从外形里找到线索吗？御窑替代：这条花纹重复了几次，是不是像给瓷器穿了一件衣服？","priority":"少量看即可"}],"order":"家庭规划建议：先选古窑或御窑，下面两条是互斥分支，不是连游顺序。 选古窑：一个开放作坊步骤→就近一两种窑→离园；没有演示就看说明，不等开工。 选御窑：先落实馆约→开放展厅看器形→看少量纹样→出馆；不强加里弄长线。 两条分支都在午饭、休息和返程准备前收尾，不再加第二景区。","rest":"家庭规划建议：古窑向工作人员询问开放休息区域；御窑使用馆内允许坐歇的座位或指定休息区。未核到具体点位，不承诺每厅有座；古窑作坊之间、御窑到馆途中都可能需露天步行。午饭后保留休息和返程缓冲。","skip":"古窑先删更多窑型、瓷乐久等与烧窑/开窑等待，不承诺当日排期。 御窑先删里弄长线、旅拍排队、额外特展与AR/MR；未约成功不保证入馆。 严格不做古窑加御窑；看懂少量内容即可返程。","links":[{"title":"景区/场馆介绍 1","url":"https://www.jdz.gov.cn/zjcd/mljdz/sj/t932863.shtml"},{"title":"景区/场馆介绍 2","url":"http://www.jdzyybwy.com/"}]}},"legs":{"2026-09-22":{"main":[{"from":"shangrao_station","to":"jinsha","name":"上饶站 → 三清山金沙索道下站","distance":"78.7 km","model":"67.1 分钟","planning":"90—120分钟","note":"OSRM静态路网约78.7km；不是实时路况，导航到酒店或正规停车场。"}],"rain":[{"from":"shangrao_station","to":"yushan","name":"上饶站 → 玉山县城","distance":"37.4 km","model":"34.2 分钟","planning":"45—65分钟","note":"此点为县城，不是玉山南站。酒店实际入口另导航。"}]},"2026-09-23":{"main":[{"from":"jinsha","to":"wuyuan_city","name":"三清山金沙索道下站 → 婺源县城","distance":"69.9 km","model":"59.3 分钟","planning":"90—120分钟","note":"静态路网约69.9km；不回玉山拿行李。"}],"rain":[{"from":"jinsha","to":"wuyuan_city","name":"三清山金沙索道下站 → 婺源县城","distance":"69.9 km","mod ":"优先比较“首都PEK直飞SQD＋接车直达金沙”和“高铁到上饶站＋租车”。不必为了三清山先逛上饶市区；不要把机场名当成景区位置。","options":[{"name":"1 · 上饶三清山机场 SQD","flight":"已核首都机场航季计划：国航CA1895，PEK→SQD，周二08:00—10:15，计划有效期覆盖9/22。当天可售、余票和执行未确认；没有证据把它写成大兴出发。","ground":"机场可预约车辆直达金沙；道路模型94.8km、76.2分钟，亲子行車预留120—150分钟，另留出机场/取车60—90分钟。直达巴士未核，车辆与座椅需预约。","when":"先核北京首都PEK直飞SQD；如当日可售且早到，预约车辆从机场直接送金沙山脚酒店，不必专程进上饶市区换乘。","links":[{"title":"上饶三清山机场—首都机场集团","url":"https://www.cah.com.cn/content/2023/01-25/7023160670078111744.html"},{"title":"首都机场官方实况/API：仅核2026-09-08","url":"https://www.bcia.com.cn/hbsk.html"},{"title":"首都机场官方航班计划表：覆盖9月22日的航季计划","url":"https://www.bcia.com.cn/hbjhb.html"},{"title":"2026夏秋航季—转载上饶市农文旅","url":"https://jx.ifeng.com/c/8sGINo6rnAp"},{"title":"景区运营网站旅游交通路线（2017）","url":"http://www.sqsfjq.com/index.php?s=/ZhengWu/News/detail/id/596.html"}]},{"name":"2 · 衢州机场 JUZ","flight":"PEK：官方航班计划有CA1891记录，但此次星期二记录止于8/31，不能外推9/22；PKX：2026夏航季新蓝网原站综合机场微信报道列有北京大兴，未核9/22。9/22具体航班与票价未核，不沿用过期班期。","ground":"需要陆路接驳，预约车或已落实的自驾；不要求经上饶市区；本版未核此机场到金沙的具体道路里程/时间，不编区间。","when":"上饶航班不合适时的区域备选；先核PEK/PKX当日直飞，再比较到金沙预约车费用和落地时间。异地还车须跨浙江/江西核价。","links":[{"title":"首都机场官方航班计划表：覆盖9月22日的航季计划","url":"https://www.bcia.com.cn/hbjhb.html"},{"title":"新蓝网2026夏航季：综合机场微信公众号","url":"https://www.cztv.com/newsDetail/861868"},{"title":"景区运营网站旅游交通路线（2017）","url":"http://www.sqsfjq.com/index.php?s=/ZhengWu/News/detail/id/596.html"}]},{"name":"3 · 景德镇机场 JDZ","flight":"PEK：政府历史发布与首都机场CA1887计划记录可证明航线；抓到记录的有效期均早于9/22；PKX：2022政府发布及2026春运报道证明历史航线，非9月22日班期。9/22具体航班与票价未核，不沿用过期班期。","ground":"陆路到金沙，无须专程到上饶市区；行程顺序下是否划算取决于航班及车辆报价；本版未核此机场到金沙的具体道路里程/时间，不编区间。","when":"若北京航班明显更好或希望景德镇同城取还车，可作备选；本行程三清山→篁岭→景德镇，入境先落景德镇会增加先去金沙再回景德镇的陆路绕行，宜优先SQD/JUZ。","links":[{"title":"首都机场官方航班计划表：覆盖9月22日的航季计划","url":"https://www.bcia.com.cn/hbjhb.html"},{"title":"景德镇市政府2022夏秋航季—仅历史航线","url":"https://jdz.gov.cn/zwgk/fdzdgknr/qtfdgkxx/xwfbh/t816239.shtml"},{"title":"景德镇日报2026春运消息转载—仅历史航线","url":"https://jx.ifeng.com/c/8qPYjqsoS2p"},{"title":"景区运营网站旅游交通路线（2017）","url":"http://www.sqsfjq.com/index.php?s=/Zhen 'use strict';
const D=JSON.parse(document.getElementById('data').textContent),E=JSON.parse(document.getElementById('extra').textContent),P=Object.fromEntries(D.pois.map(x=>[x.id,x])),H=Object.fromEntries(D.hotels.map(x=>[x.id,x]));
const $=s=>document.querySelector(s),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let page='overview',day=0,section='plan',arrival='rail',rain=false,view=[],defaultView=[],checked=[],lastFocus=null;
try{checked=JSON.parse(localStorage.getItem('jx-family-20260922')||'[]');if(!Array.isArray(checked))checked=[]}catch(e){}
const sections=[['plan','行程'],['kids','带娃'],['food','吃饭'],['hotel','住宿'],['tips','须知']];
function cite(ids=[]){return ids.filter(id=>D.sources.some(s=>s.id===id)).map(id=>`<a href="#source-${id}" class="cite" data-source="${id}">[${id}]</a>`).join('')}
function links(items=[]){return items.filter(s=>/^https?:\/\//.test(s.url||'')).map(s=>`<a class="button" href="${esc(s.url)}" target="_blank" rel="noreferrer">${esc(s.title||s.label||'查看来源')} ↗</a>`).join('')}
function mapDayText(i){if(page==='day'&&rain)return ['抵达 → 安全落脚处休息','金沙 → 婺源，取消登山','婺源县城休整，不去篁岭','婺源 → 陶溪川，跳过菊径','御窑馆替代 → 北站返程'][i];return [arrival==='air'?'三清山机场 → 金沙入住':'上饶站 → 金沙入住','三清山登山 → 婺源入住','婺源 ↔ 篁岭，回县城住','婺源 → 菊径可选 → 陶溪川','古窑／御窑二选一 → 北站'][i]}
function mapDates(){const indices=page==='overview'?[0,1,2,3,4]:[day],anchors=[arrival==='air'?'sqd_terminal':'shangrao_station','jinsha','huangling','jujing','taoxichuan'];$('.map-date-overlay').innerHTML=indices.map(i=>`<button class="map-date-card" data-map-day="${i}" data-day="${i}" data-anchor="${anchors[i]}" aria-label="9/${D.days[i].date.slice(-2)} ${esc(mapDayText(i))}，查看当天安排"><strong>9/${D.days[i].date.slice(-2)} · ${['抵达','登山','古村','转场','返程'][i]}</strong><span>${esc(mapDayText(i))}</span></button>`).join('')}
function placeDateLeaders(){const svg=$('#map-svg'),layer=$('.map-date-leaders');if(!svg||!layer)return;layer.innerHTML='';if(page!=='overview')return;const b=svg.getBoundingClientRect(),[vx,vy,vw,vh]=view,s=Math.min(b.width/vw,b.height/vh);layer.setAttribute('viewBox',`0 0 ${b.width} ${b.height}`);layer.innerHTML=[...document.querySelectorAll('.map-date-card')].map(c=>{const p=P[c.dataset.anchor],[x,y]=project(p.lon,p.lat),px=(x-vx)*s+(b.width-vw*s)/2,py=(y-vy)*s+(b.height-vh*s)/2;if(px<0||px>b.width||py<0||py>b.height)return '';const r=c.getBoundingClientRect(),left=r.left-b.left,top=r.top-b.top,cx=Math.max(left,Math.min(px,left+r.width)),cy=Math.max(top,Math.min(py,top+r.height));return `<line x1="${cx}" y1="${cy}" x2="${px}" y2="${py}"/><circle cx="${px}" cy="${py}" r="2"/>`}).join('')}
function mapMarkup(){return $('#map-template').innerHTML}
function accordion(title,body,open=false){return `<details class="accordion" ${open?'open':''}><summary>${title}</summary><div class="body-copy">${body}</div></details>`}
function go(p,i=day,s=section){const hash=p==='day'?`#day/${i}/${s}`:`#${p}`;if(location.hash===hash){readRoute()}else location.hash=hash}
function readRoute(){const a=location.hash.slice(1).split('/');page=['overview','day','travel'].includes(a[0])?a[0]:'overview';if(page==='day'){const n=Number(a[1]);const next=Number.isInteger(n)&&n>=0&&n<5?n:0;if(next!==day)rain=false;day=next;section=sections.some(x=>x[0]===a[2])?a[2]:'plan'}render();window.scrollTo(0,0)}
function overview(){return `<div class="stack"><section><div class="kicker">FAMILY TRIP · 2026</div><h1>去山里，也去瓷都</h1><p class="intro">三清山看山景，婺源看晒秋，景德镇玩陶泥。每天一个主项目，给孩子留出休息时间。</p><div class="pills"><span class="pill">5天4晚</span><span class="pill">6岁 · 120cm</span><span class="pill">连锁酒店</span><span class="pill">当地租车</span></div></section><div class="note">中秋9/25—27，高速不免费。登山与篁岭安排在假期前；所有票、房、车均未预订。${cite([10,11])}</div>${mapMarkup()}<section><div class="section-head"><h2>五天怎么走</h2><small>点一天，看完整安排</small></div><div class="rows">${D.days.map((d,i)=>`<button class="day-row" data-day="${i}"><span class="number">${d.date.slice(-2)}<small>9月 · ${d.weekday}</small></span><span><strong>${esc(d.card)}</strong><p>${esc(d.short)}</p><p>${esc(E.dayBriefs[i])}</p></span><span class="chev">›</span></button>`).join('')}</div></section><section class="card"><div class="section-head"><h2>四晚，不来回搬酒店</h2></div><div class="split"><div class="stay-block"><strong>金沙山脚</strong><small>22日 · 1晚</small></div><div class="stay-block"><strong>婺源县城</strong><small>23—24日 · 2晚</small></div><div class="stay-block"><strong>景德镇</strong><small>25日 · 1晚</small></div></div><p class="intro">君澜 → 全季 / 汉庭 → 凯悦嘉轩等连锁候选。具体门店和入住条件在每日“住宿”。</p></section>${accordion('整体路线与安排逻辑',`<p class="route-strip">北京 → 上饶站取车 → 三清山金沙 → 婺源县城（篁岭往返） → 菊径可选 → 景德镇 → 北站还车返京。</p><ul><li>首日只抵达和休息，不塞篁岭与夜游。</li><li>23日唯一登山，24日古村短线；婺源连住减少折返。</li><li>25日孩子累就删菊径；26日古窑、御窑馆二选一。</li><li>不默认九江25分钟紧换乘，若坐夜车可能27日到北京。</li></ul>`)}${accordion('带娃、吃饭与天气怎么用',`<p>每日“带娃”区分自主游戏和收费体验；具体课程的年龄、费用及预约以场馆确认为准。所有活动都可删减，不加远途赶场。</p><p>“吃饭”列真实门店候选与来源；特色菜不等于都适合孩子，儿童点餐建议另列。营业、排队和口味仍需到店确认。</p><p>天气卡区分出行日预报和气候参考。温度没有可靠数据就不填，山脚/县城温度不冒充山顶天气。本文件不会自动联网更新。</p>`)}<button class="button" data-page="travel">查看出行准备与核对清单 →</button></div>`}
function weatherCard(){const w=E.weatherDays[D.days[day].date];return `<section class="weather"><div class="weather-head"><span class="weather-title">${esc(w.place)} · 天气</span><span class="temp">${esc(w.temperature||'温度待更新')}</span></div><p>${esc(w.statusText)}</p><details><summary>天气说明与穿衣建议 ›</summary><div class="body-copy"><p>${esc(w.note)}</p><p>${esc(w.clothing)}</p>${w.climate?`<p><b>历史气候参考，不是预报：</b>${esc(w.climate)}</p>`:''}<p>${esc(w.updateAdvice)}</p><div class="actions">${links(w.links)}</div></div></details></section>`}
function arrivalPicker(){return `<div class="arrival-picker" aria-label="首日到达方式"><button data-arrival="rail" aria-pressed="${arrival==='rail'}">高铁到上饶站</button><button data-arrival="air" aria-pressed="${arrival==='air'}">飞机到三清山机场</button></div><div class="note">${arrival==='air'?'机场在上饶市南，不在景区；落地后可直接接车去金沙，不必进市区。此为路线比较，9/22机票尚未确认。':'保留原高铁方案；也可切换飞机查看机场直达金沙路线。切换不会预订或确定交通方式。'}</div>`}
function guideHtml(date){const g=E.guides[date];return `<section class="card"><div class="section-head"><h2>这一天，值得看什么</h2><span class="label">${esc(g.theme)}</span></div><div class="guide-list">${g.highlights.map(h=>`<details><summary><strong>${esc(h.name)}</strong><span class="tag">${esc(h.priority||'亲子推荐')}</span></summary><p>${esc(h.why)}</p><div class="child-line">可以这样跟孩子说：${esc(h.childLine)}</div></details>`).join('')}</div>${accordion('现场顺序、休息与取舍',`<p><b>推荐顺序：</b>${esc(g.order)}</p><p><b>哪里歇一歇：</b>${esc(g.rest)}</p><p><b>可以不去：</b>${esc(g.skip)}</p><div class="actions">${links(g.links)}</div>`)}<p class="small">优先级按这次亲子路线判断，不是要求所有项目都打卡。</p></section>`}
function legCards(items){return items.map(l=>`<article class="leg-card"><h3>${esc(l.name)}</h3><div class="leg-metrics"><div><strong>${esc(l.distance)}</strong><small>道路模型里程</small></div><div><strong>${esc(l.model)}</strong><small>模型行车时间</small></div><div><strong>${esc(l.planning)}</strong><small>亲子规划预留</small></div></div><p class="small">${esc(l.note)}</p></article>`).join('')}
function segmentHtml(d){const items=day===0&&arrival==='air'?E.airLegs:E.legs[d.date][rain?'rain':'main'];return `<section class="card"><div class="section-head"><h2>分段里程与时间</h2></div>${legCards(items)}<p class="small">道路数据为OSRM静态模型，非实时导航；代表点不等于停车入口。景区步行距离未核实，按时间与体力减量，不填猜测里程。</p></section>`}
function allSegmentsHtml(){return accordion('全程分段里程与时间',`${D.days.map(d=>`<h3>${esc(d.date)} · ${esc(d.card)}</h3>${legCards(E.legs[d.date].main)}`).join('')}<h3>首日飞机替代</h3>${legCards(E.airLegs)}<p>北京往返的大交通仍按实际选定车次/航班确认；不把飞行时长当门到门用时。索道、排队、步行、取还车与候车另留余量。</p>`)}
function flightHtml(){const f=E.flightUI;return `<section class="card"><div class="kicker">北京出发 · 飞机还是高铁</div><h2>落地后，能直接去三清山吗？</h2><p class="intro">${esc(f.summary)}</p><div class="note" style="margin-top:12px">${esc(f.recommendation)}</div><div class="rows" style="margin-top:12px">${f.options.map(o=>accordion(esc(o.name),`<p><b>航班：</b>${esc(o.flight)}</p><p><b>地面接驳：</b>${esc(o.ground)}</p><p><b>适合：</b>${esc(o.when)}</p><div class="actions">${links(o.links)}</div>`)).join('')}</div>${accordion('怎么选票，怎么安排接车',`<ul>${f.steps.map(x=>`<li>${esc(x)}</li>`).join('')}</ul><div class="actions">${links(f.links)}</div>`)}<button class="button" data-day="0" style="margin-top:12px">去首日页面切换飞机 / 高铁路线 →</button></section>`}
function hotelPriceHtml(id){const p=E.hotelPrices[id];if(!p)return '<div class="price-box"><strong>房价待核</strong><p class="small">此店仅为路线备用，尚未查询对应入住日期。</p></div>';return `<div class="price-box"><div class="section-head"><strong>${esc(p.priceLabel)}</strong><span class="label">${esc(p.statusLabel)}</span></div><p class="small">${esc(p.stayLabel)}</p><p class="small">${esc(p.roomLabel)}</p>${p.conditions?`<p class="small">${esc(p.conditions)}</p>`:''}${accordion('报价条件与核验时间',`<p>${esc(p.note)}</p><p>核验：${esc(p.checkedAt)}</p><div class="actions">${links(p.links)}</div>`)}<p class="small">未预订；房价、税费、儿童及早餐条件以最终订单页为准。</p></div>`}
function openPoint(id){const p=E.pointCards[id];if(!p)return;lastFocus=document.activeElement;$('#dialog-title').textContent=p.name;$('#dialog-body').innerHTML=`<div class="pills"><span class="pill">${esc(p.priority)}</span><span class="pill">${esc(p.duration)}</span></div><p class="point-intro">${esc(p.intro)}</p><div class="body-copy"><h3>看什么 / 做什么</h3><p>${esc(p.see)}</p><h3>带娃与交通提醒</h3><p>${esc(p.note)}</p></div><div class="actions">${p.days.map(i=>`<button class="button" data-day="${i}">查看9/${22+i}当天安排 →</button>`).join('')}</div><div class="actions">${links(p.links)}</div><p class="small">地图代表点，不是停车或接送入口；停留时长为规划建议。</p>`;$('#info-dialog').showModal()}
function chosenDay(i=day){return i===0&&arrival==='air'?E.airDay:D.days[i]}
function dayView(){const d=chosenDay();return `<div class="day-heading"><div class="kicker">DAY 0${day+1} · ${esc(d.date)}${d.holiday?' · 中秋假期':''}</div><h1>${esc(d.card)}</h1><p>${esc(rain?d.rainSummary:d.summary)}</p></div>${day===0?arrivalPicker():''}<div class="stack">${weatherCard()}${mapMarkup()}</div><div class="mode-row"><small>${esc(rain?'省力替代方案':d.effort)}</small><button class="mode" id="rain-toggle" aria-pressed="${rain}">${rain?'返回主线':'雨天 / 孩子累了'}</button></div><div class="segments" role="tablist" aria-label="当日内容">${sections.map(([id,label])=>`<button role="tab" id="section-${id}" data-section="${id}" aria-controls="day-content" aria-selected="${id===section}" tabindex="${id===section?0:-1}">${label}</button>`).join('')}</div><div id="day-content" class="content-area" role="tabpanel" aria-labelledby="section-${section}">${dailyContent()}</div>`}
function dailyContent(){const d=chosenDay(),food=D.food.find(x=>x.date===d.date);if(section==='plan')return `${guideHtml(d.date)}<section class="card"><div class="section-head"><h2>${rain?'省力时间轴':'当天时间轴'}</h2><small>建议时段 · 随体力调整</small></div><ol class="schedule">${(rain?d.rainTimeline:d.timeline).map(x=>`<li><div class="time">${esc(x.time)}</div><div class="event"><h3>${esc(x.title)}</h3>${x.tag?`<span class="tag">${esc(x.tag)}</span>`:''}<p>${esc(x.text)}${cite(x.sources)}</p></div></li>`).join('')}</ol></section>${segmentHtml(d)}${accordion('路线补充说明',`<p><b>${esc(rain?d.rainDrive:d.drive)}</b></p>${(rain?d.rainLegs:d.legs).map(l=>`<p><b>${esc(l.name)}</b><br>${esc(l.time)}<br>${esc(l.note)}${cite(l.sources)}</p>`).join('')}`)}<div class="note">${esc(d.sleepLabel)} · 门票与120cm临界规则请看“须知”。</div>`;
if(section==='kids')return `<div class="note">${rain?'当前为雨天/省力模式：优先使用每项的雨备；不默认原户外项目仍可玩。':'自主游戏不额外赶路；收费体验需确认年龄和预约。'} 建议时长不是场馆保证。${esc(E.kidsRules[d.date])}</div>${E.kidsDays[d.date].map(k=>`<article class="card activity"><span class="label">${esc(k.type)} · ${esc(k.duration)}</span><h3>${esc(k.name)}</h3><p><b>怎么玩：</b>${esc(k.play)}</p><p><b>适合孩子：</b>${esc(k.fit)}</p><p><b>陪同与安全：</b>${esc(k.safety)}</p>${accordion('费用、预约与雨备',`<p>${esc(k.booking)}</p><p><b>雨备：</b>${esc(k.rain)}</p><div class="actions">${links(k.links)}</div>`)}</article>`).join('')}`;
if(section==='food'){const rs=E.restaurants.filter(r=>r.dates.includes(d.date));return `<div class="note">先吃饱，再尝特色。江西菜常偏辣，明确“完全不辣、辣汁另放”；不要把“微辣”当儿童口味。店铺未电话确认当日营业。</div>${rs.map(r=>`<article class="card restaurant"><span class="label">${esc(r.area)} · ${esc(r.role)}</span><h3>${esc(r.name)}</h3><p class="meta">${esc(r.address)}</p><p class="dish"><b>特色菜 / 已见菜单</b><br>${esc(r.specialties)}</p><p class="dish"><b>给孩子怎么点</b><br>${esc(r.child)}</p><p class="meta">${esc(r.childEvidence)}</p>${accordion('到店前确认与来源',`<p>${esc(r.caveat)}</p><div class="actions">${links(r.links)}</div>`)}<div class="actions"><a class="button" target="_blank" rel="noreferrer" href="https://www.amap.com/search?query=${encodeURIComponent(r.name+' '+r.address)}">按店名查位置 ↗</a></div></article>`).join('')}${!rs.length?'<div class="card body-copy">这一天尚无充分核实的具体店铺；采用酒店或正规就近餐饮，点餐前问清口味。</div>':''}${accordion('早餐、午餐、晚餐与加餐建议',`${[['早餐',food.breakfast],['午餐',food.lunch],['晚餐',food.dinner],['加餐',food.snack]].map(([n,t])=>`<div class="meal"><b>${n}</b><p>${esc(t)}</p></div>`).join('')}<p class="small">以上是点餐建议，不是保证上述餐厅有售。鱼刺由家长处理；食物过敏按孩子实际情况另核。</p>`)}<div class="small">门店是顺路候选，不为吃饭跨城折返；午休与返程优先。</div>`}
if(section==='hotel')return `${d.hotelIds.length?'<div class="note">仅列连锁候选，未查出行日期房价房态；两大一小必须按实际人数询房。</div>':'<div class="note">今天返程，不新增当地住宿；夜车可能次日到家。</div>'}${d.hotelIds.map((id,i)=>{const h=H[id];return `<article class="card hotel"><span class="label">${esc(h.brand)} · ${i?'备选':'优先询房'}</span><h3>${esc(h.name)}</h3><p class="meta">${esc(h.address)}</p><p class="intro">${esc(h.family_room.suggestion)}</p>${hotelPriceHtml(id)}${accordion('房型、停车与核验信息',`<p><b>所见房型：</b>${esc(h.family_room.observed)}</p><p><b>停车：</b>${esc(h.parking.caveat)}</p><p>确认三人入住许可、床宽、儿童早餐与取消条款；不保证加床或免费停车。</p>${cite(h.source_ids)}`)}<div class="actions"><a class="button" target="_blank" rel="noreferrer" href="https://www.amap.com/search?query=${encodeURIComponent(h.name)}">按门店名查位置 ↗</a></div></article>`}).join('')}`;
return `<section class="card"><div class="section-head"><h2>门票与孩子优免</h2></div><p class="body-copy">${esc(d.ticketNote)}${cite(d.ticketSources)}</p></section><section class="card"><div class="section-head"><h2>当天该做的取舍</h2></div><div class="body-copy"><ul>${d.tips.map(t=>`<li>${esc(t)}</li>`).join('')}</ul></div></section><button class="button" data-page="travel">查看全部规则与预订清单 →</button>`}
function travel(){return `<div class="stack"><section><div class="kicker">BEFORE YOU GO</div><h1>出行，先把关键事定好</h1><p class="intro">车票 → 租车与座椅 → 酒店 → 景区预约。没有确定的项目不当作已预订。</p></section>${flightHtml()}${allSegmentsHtml()}<section class="card"><div class="section-head"><h2>出发前核对</h2><small id="check-count"></small></div><div class="progress"><div id="check-progress"></div></div><div class="checklist">${D.checks.map((c,i)=>`<label><input type="checkbox" data-check="${i}" ${checked.includes(i)?'checked':''}><span>${esc(c)}</span></label>`).join('')}</div><p class="small" id="storage-note">只在本机保存，不提交任何订单。</p></section><section><div class="section-head"><h2>往返交通与租车</h2></div><div class="rows">${D.transportNotes.map(n=>accordion(esc(n.title),`<p>${esc(n.text)}${cite(n.sources)}</p>`)).join('')}</div></section><section><div class="section-head"><h2>儿童票与实用规则</h2></div><div class="rows">${D.rules.map(r=>accordion(esc(r.title),`<p>${esc(r.text)}${cite(r.sources)}</p>`)).join('')}</div></section><section class="card"><h3>天气与随身物品</h3><p class="intro">薄长袖、可脱外层、儿童雨衣、防滑鞋、水和熟悉的零食。山地天气与县城不同，出发前、上山前分别核预报和景区公告。</p><p class="intro">温度/天气卡为核验时快照，不自动更新；已标为“待更新”的日期不要据此决定上山。</p></section><div class="actions"><button class="button" data-info="all">资料来源与使用说明</button><button class="button" id="print-button">打印五天行程</button></div></div>`}
function render(){$('.app').dataset.page=page;document.title=(page==='day'?D.days[day].card:page==='travel'?'出行准备':'赣东北亲子旅行')+' · 旅行手册';$('#dates').hidden=page!=='day';$('#dates').innerHTML=D.days.map((d,i)=>`<button class="date" role="tab" id="date-${i}" data-day="${i}" aria-controls="main" aria-selected="${i===day}" tabindex="${i===day?0:-1}"><span>9月</span><strong>${d.date.slice(-2)}</strong><em>${d.holiday?'中秋':d.weekday}</em></button>`).join('');document.querySelectorAll('.bottom button').forEach(b=>{if(b.dataset.page===page)b.setAttribute('aria-current','page');else b.removeAttribute('aria-current')});$('#main').innerHTML=page==='overview'?overview():page==='travel'?travel():dayView();if(page!=='travel')drawMap();else progress();$('#main').setAttribute('aria-label',page==='day'?D.days[day].date+' '+sections.find(x=>x[0]===section)[1]:page==='overview'?'整体行程':'出行准备');}
function progress(){const count=checked.filter(i=>Number.isInteger(i)&&i>=0&&i<D.checks.length).length;$('#check-count').textContent=`${count} / ${D.checks.length} 已核对`;$('#check-progress').style.width=(count/D.checks.length*100)+'%'}
function openInfo(id){lastFocus=document.activeElement;$('#dialog-title').textContent=id?'来源与核验':'资料与说明';const items=id?D.sources.filter(s=>String(s.id)===String(id)):D.sources;$('#dialog-body').innerHTML=`<div class="body-copy"><p>行程资料核验于2026-09-08；天气、餐厅和儿童活动的核验边界详见各卡片。网页可离线查看，不是实时天气、导航或预订系统。</p><p>具体课程、房态、车票、餐厅营业及儿童优免以出发前官方或门店确认为准。所列建议不等于已预订。</p></div><ol class="sources-list">${items.map(s=>`<li value="${s.id}"><a href="${esc(s.url)}" target="_blank" rel="noreferrer">${esc(s.title||s.url)}</a></li>`).join('')}</ol>${!id?`<h3>新增资料</h3><div class="actions">${links(E.sources)}</div>`:''}`;$('#info-dialog').showModal()}
function project(lon,lat){const n=2**D.map.zoom*256,r=lat*Math.PI/180;return[(lon+180)/360*n-D.map.left,(1-Math.asinh(Math.tan(r))/Math.PI)/2*n-D.map.top]}
function route(a,b){let r=D.routes.find(r=>r.from===a&&r.to===b);if(r)return r;let back=D.routes.find(r=>r.from===b&&r.to===a);return back?{...back,geometry:{coordinates:[...back.geometry.coordinates].reverse()}}:null}
function setView(v){view=v;const svg=$('#map-svg');if(!svg)return;svg.setAttribute('viewBox',v.join(' '));const box=svg.getBoundingClientRect(),s=Math.min(box.width/v[2],box.height/v[3]);if(!s)return;svg.querySelectorAll('.marker').forEach(m=>{m.querySelector('.marker-content').setAttribute('transform',`scale(${1/s})`);const px=(Number(m.dataset.x)-v[0])*s+(box.width-v[2]*s)/2,l=m.querySelector('.marker-label');l.setAttribute('x',px>box.width*.6?-12:12);l.setAttribute('text-anchor',px>box.width*.6?'end':'start')});placeDateLeaders()}
function drawMap(){const all=page==='overview',ds=all?D.days.map((d,i)=>chosenDay(i)):[chosenDay()],coords=[];let lines='';ds.forEach(d=>{const ids=!all&&rain?d.rainStops:d.stops;ids.slice(0,-1).forEach((a,i)=>{const b=ids[i+1],r=route(a,b),ps=(r?.geometry?.coordinates||[[P[a].lon,P[a].lat],[P[b].lon,P[b].lat]]).map(p=>project(...p));coords.push(...ps);const path=ps.map((p,j)=>(j?'L':'M')+p.join(',')).join(' ');lines+=`<path class="route-line halo" d="${path}"/><path class="route-line ${r?'':'estimated'}" d="${path}"/>`})});$('#route-layer').innerHTML=lines;const ids=all?[arrival==='air'?'sqd_terminal':'shangrao_station','jinsha','wuyuan_city','huangling','jujing','taoxichuan']:[...new Set(rain?chosenDay().rainStops:chosenDay().stops)];$('#marker-layer').innerHTML=ids.map((id,i)=>{const p=P[id],[x,y]=project(p.lon,p.lat);coords.push([x,y]);const label=all?({sqd_terminal:'三清山机场',shangrao_station:'上饶站',jinsha:'三清山',wuyuan_city:'婺源',huangling:'篁岭',jujing:'菊径',taoxichuan:'景德镇'})[id]:D.labels[id]||p.name;return `<g class="marker" role="button" tabindex="0" data-poi="${id}" aria-label="查看${esc(p.name)}介绍" data-x="${x}" transform="translate(${x},${y})"><title>${esc(p.name)} · 区域代表点</title><g class="marker-content"><circle class="hit" r="20"/><circle r="9"/><text class="num" y="3">${i+1}</text><text class="marker-label" x="12" y="${id==='taoxichuan'&&all?20:-12}">${esc(label)}</text></g></g>`}).join('');if(all||coords.length<2)defaultView=[0,0,D.map.width,D.map.height];else{const xs=coords.map(p=>p[0]),ys=coords.map(p=>p[1]),minx=Math.min(...xs),maxx=Math.max(...xs),miny=Math.min(...ys),maxy=Math.max(...ys),w=Math.max(150,maxx-minx+95),h=Math.max(140,maxy-miny+95);defaultView=[(minx+maxx-w)/2,(miny+maxy-h)/2,w,h]}mapDates();setView(defaultView);$('#map-title').textContent=all?'全程 · 江西当地路线':rain?D.days[day].date.slice(5).replace('-','/')+' · 雨天 / 省力路线':D.days[day].date.slice(5).replace('-','/')+' · '+chosenDay().short;$('#map-points').innerHTML=ids.map(id=>`<button class="point-chip" data-poi="${id}">${esc(E.pointCards[id].name)} ›</button>`).join('')}
document.addEventListener('click',e=>{const point=e.target.closest('[data-poi]');if(point){openPoint(point.dataset.poi);return}const b=e.target.closest('button,a');if(!b)return;if(b.dataset.arrival){arrival=b.dataset.arrival;rain=false;render();window.scrollTo(0,0);return}if(b.dataset.page){go(b.dataset.page);return}if(b.dataset.day!==undefined){if($('#info-dialog').open)$('#info-dialog').close();go('day',Number(b.dataset.day),'plan');return}if(b.dataset.section){section=b.dataset.section;history.replaceState(null,'',`#day/${day}/${section}`);$('#day-content').innerHTML=dailyContent();document.querySelectorAll('[data-section]').forEach(x=>{x.setAttribute('aria-selected',String(x.dataset.section===section));x.tabIndex=x.dataset.section===section?0:-1});$('#day-content').setAttribute('aria-labelledby','section-'+section);const seg=$('.segments');window.scrollTo(0,scrollY+seg.getBoundingClientRect().top-$('.topbar').getBoundingClientRect().height);return}if(b.id==='rain-toggle'){const y=scrollY;rain=!rain;$('#main').innerHTML=dayView();drawMap();window.scrollTo(0,y);$('#rain-toggle').focus({preventScroll:true});return}if(b.dataset.map){const[x,y,w,h]=view;if(b.dataset.map==='reset')setView(defaultView);else{const f=b.dataset.map==='in'?.76:1.3;setView([x+(w-w*f)/2,y+(h-h*f)/2,w*f,h*f])}return}if(b.dataset.source){e.preventDefault();openInfo(b.dataset.source)}if(b.id==='info-button'||b.dataset.info)openInfo();if(b.id==='dialog-close')$('#info-dialog').close();if(b.id==='print-button')window.print()});
document.addEventListener('change',e=>{if(e.target.matches('[data-check]')){checked=[...document.querySelectorAll('[data-check]:checked')].map(x=>Number(x.dataset.check));try{localStorage.setItem('jx-family-20260922',JSON.stringify(checked))}catch(err){$('#storage-note').textContent='当前浏览器无法保存；勾选仅在本次打开有效。'}progress()}});
document.addEventListener('keydown',e=>{const b=e.target;if(b.matches('[data-poi]')&&['Enter',' '].includes(e.key)){e.preventDefault();openPoint(b.dataset.poi);return}if(b.matches('.date')&&['ArrowLeft','ArrowRight','Home','End'].includes(e.key)){e.preventDefault();const i=e.key==='Home'?0:e.key==='End'?4:(day+(e.key==='ArrowRight'?1:4))%5;go('day',i,'plan');setTimeout(()=>$('#date-'+i)?.focus({preventScroll:true}),50)}if(b.matches('[data-section]')&&['ArrowLeft','ArrowRight'].includes(e.key)){e.preventDefault();const i=sections.findIndex(x=>x[0]===section),n=(i+(e.key==='ArrowRight'?1:4))%5;const next=$('[data-section="'+sections[n][0]+'"]');next.click();next.focus({preventScroll:true})}});
$('#info-dialog').addEventListener('close',()=>lastFocus?.focus({preventScroll:true}));new ResizeObserver(()=>document.documentElement.style.setProperty('--header-height',$('.topbar').getBoundingClientRect().height+'px')).observe($('.topbar'));window.addEventListener('hashchange',readRoute);window.addEventListener('resize',()=>setView(view));
$('#print-content').innerHTML='<h1>赣东北五日亲子行程</h1><p>2026.09.22—26 · 2大1小 · 未预订</p>'+D.days.map(d=>`<section class="print-day"><h2>${d.date} ${esc(d.title)}</h2><p>${esc(d.summary)}</p>${d.timeline.map(x=>`<p><b>${esc(x.time)} · ${esc(x.title)}</b><br>${esc(x.text)}</p>`).join('')}<p><b>住宿：</b>${esc(d.hotelIds.map(id=>H[id].name).join(' / ')||'返程')}</p><p><b>儿童票：</b>${esc(d.ticketNote)}</p></section>`).join('');readRoute();window.__appTest={state:()=>({page,day,section,arrival,rain,checked}),data:D,extra:E,go};
</script></body></html>
